# Render Blueprint for the multiplayer server. The client is deployed separately to GitHub Pages.
# See docs/multiplayer-server.md. Root directory stays empty: the build needs the whole pnpm workspace.
services:
  - type: web
    name: tatp-server
    runtime: node
    plan: free # sleeps after ~15 min without traffic (cold start on the next visit). Switch to `starter` for always-on.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tatp/server build
    startCommand: node packages/server/dist/index.cjs
    healthCheckPath: /health
    buildFilter:
      paths:
        - packages/server/**
        - packages/game/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: ALLOWED_ORIGINS
        value: https://westphalenpablo.github.io
